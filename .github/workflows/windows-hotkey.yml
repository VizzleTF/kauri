name: windows-hotkey

on:
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-hotkey.yml"]
  workflow_dispatch:

jobs:
  hotkey:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [notepad, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish windows/Kauri -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - name: Hot key opens the menu over ${{ matrix.target }}
        shell: pwsh
        run: windows/tools/hotkey-test.ps1 -Exe dist\Kauri.exe -Target ${{ matrix.target }} -Rounds 6 -Out "$env:RUNNER_TEMP\hotkey-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotkey-${{ matrix.target }}
          path: ${{ runner.temp }}/hotkey-${{ matrix.target }}.txt
